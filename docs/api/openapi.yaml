openapi: 3.1.0
info:
  title: DevSparks DeployCheck REST API
  description: |
    Versioned REST API for DevSparks DeployCheck — Open-source developer operations platform by DevSparks India.
    Supports pre-deployment static auditing, BYOK AI assistance, workspace entitlements, and server readiness checks.
  version: 1.0.0
  contact:
    name: DevSparks India
    url: https://github.com/nkdhawan76/DevSparks-India-opensource-1
    email: nkdhawan76@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local development instance
  - url: https://api.deploycheck.devsparksindia.com/api/v1
    description: Production API

paths:
  /health:
    get:
      summary: System Health & Readiness Check
      description: Returns control plane operational status and enforced invariants.
      operationId: getHealth
      responses:
        '200':
          description: Control plane is operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /audits:
    post:
      summary: Run Pre-Deployment Audit
      description: |
        Executes static analysis on provided project files.
        Checks for exposed secrets, missing lockfiles, and configuration defects.
        Enforces server-side `audit.basic` entitlement.
      operationId: runAudit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRequest'
      responses:
        '200':
          description: Audit completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResponse'
        '400':
          description: Validation error or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature entitlement denied or quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ai/connections:
    post:
      summary: Store BYOK Provider Key
      description: |
        Connects an AI provider API key (e.g., OpenRouter).
        The key is encrypted at rest using AES-256-GCM. Raw keys are never returned.
      operationId: createAIConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConnectionRequest'
      responses:
        '200':
          description: Key encrypted and stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConnectionResponse'
        '403':
          description: AI assistance entitlement denied

  /ai/explain:
    post:
      summary: Generate AI Explanation & Code Patch
      description: |
        Provides sanitized context of an audit finding to the configured AI model.
        Returns an explanation and a structured side-by-side patch proposal.
        Does NOT apply changes automatically.
      operationId: explainFinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIExplainRequest'
      responses:
        '200':
          description: AI proposal generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIExplainResponse'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
          example: 0.1.0-dev
        timestamp:
          type: string
          format: date-time
        service:
          type: string
          example: DevSparks DeployCheck Control Plane
        invariants:
          type: object
          properties:
            theme:
              type: string
              example: light-only
            aiPolicyControlled:
              type: boolean
              example: true
            entitlementsEnforced:
              type: boolean
              example: true

    AuditRequest:
      type: object
      required:
        - workspaceId
        - projectId
        - files
      properties:
        workspaceId:
          type: string
          example: ws-main
        projectId:
          type: string
          example: proj-101
        files:
          type: object
          additionalProperties:
            type: string
          description: Key-value map of relative file path to file text content

    AuditResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: [SUCCESS, WARNING, FAILED]
            summary:
              type: object
              properties:
                totalFindings:
                  type: integer
                criticalCount:
                  type: integer
                highCount:
                  type: integer
                isDeployReady:
                  type: boolean
            findings:
              type: array
              items:
                $ref: '#/components/schemas/AuditFinding'

    AuditFinding:
      type: object
      properties:
        id:
          type: string
        ruleId:
          type: string
          example: SEC-001
        severity:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW, INFORMATIONAL]
        title:
          type: string
        description:
          type: string
        filePath:
          type: string
        lineStart:
          type: integer
        remediation:
          type: string
        aiFixAvailable:
          type: boolean

    AIConnectionRequest:
      type: object
      required:
        - workspaceId
        - providerKey
        - apiKey
      properties:
        workspaceId:
          type: string
        providerKey:
          type: string
          example: openrouter
        apiKey:
          type: string
          example: sk-or-v1-abcdef1234567890
        displayName:
          type: string

    AIConnectionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
            providerKey:
              type: string
            maskedKey:
              type: string
              example: sk-o••••••••7890
            status:
              type: string

    AIExplainRequest:
      type: object
      required:
        - workspaceId
        - findingTitle
      properties:
        workspaceId:
          type: string
        findingId:
          type: string
        findingTitle:
          type: string
        findingDescription:
          type: string
        affectedFile:
          type: string
        affectedCodeSnippet:
          type: string
        remediationAdvice:
          type: string

    AIExplainResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            explanation:
              type: string
            patch:
              type: object
              properties:
                id:
                  type: string
                summary:
                  type: string
                patches:
                  type: array
                  items:
                    type: object
                    properties:
                      filePath:
                        type: string
                      originalSnippet:
                        type: string
                      suggestedSnippet:
                        type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string

