name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: "npm"

      - name: Verify Tag Matches package.json
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          echo "Release tag: $TAG_NAME"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_NAME" != "$PKG_VERSION" ]; then
            echo "::error::Tag name ($TAG_NAME) does not match package.json version ($PKG_VERSION)!"
            exit 1
          fi

      - name: Verify Changelog Entry Exists
        run: |
          CLEAN_VER="${{ github.ref_name }}"
          CLEAN_VER="${CLEAN_VER#v}"
          if ! grep -q "## \[$CLEAN_VER\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing an entry for version [$CLEAN_VER]!"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: CodeQL Remediation Verification
        run: node scripts/verify-codeql-fixes.mjs

      - name: Core Verification Suite
        run: node scripts/verify-mvp.mjs

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Strict ESLint Validation (Zero Warnings)
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Determine Prerelease Status
        id: prerelease_check
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-alpha"* || "$TAG" == *"-beta"* || "$TAG" == *"-rc"* || "$TAG" == *"-dev"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Prerelease detected: true"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Stable release detected: false"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          name: DevSparks DeployCheck ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease == 'true' }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
