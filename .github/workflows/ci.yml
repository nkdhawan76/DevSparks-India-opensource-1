name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Verify package-lock integrity & install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::error::package-lock.json is missing! Failing CI per Zero-Failure CI Invariant."
            exit 1
          fi

      - name: CodeQL Remediation Unit Tests
        run: node scripts/verify-codeql-fixes.mjs

      - name: Core Platform Verification Suite
        run: node scripts/verify-mvp.mjs

      - name: Pre-Deployment Architecture Auditor
        run: node scripts/run-audit.mjs

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Strict ESLint Validation (Zero Warnings)
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Production Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Clean Working Tree Check
        run: git diff --check
